version: '3.8'

services:
  # Nginx Reverse Proxy
  nginx-proxy:
    build: ./nginx-proxy
    ports:
      - "9443:9443"
    depends_on:
      - angular-dev
      - php-backend
    networks:
      - caldev-network

  # Angular Frontend - Development
  angular-dev:
    image: 248189916187.dkr.ecr.us-west-2.amazonaws.com/caldev-frontend:latest
    expose:
      - "80"
    environment:
      - NODE_ENV=development
      - API_URL=/api
    networks:
      - caldev-network

  # Angular Frontend - Production
  angular-prod:
    image: 248189916187.dkr.ecr.us-west-2.amazonaws.com/caldev-frontend:latest
    ports:
      - "8080:80"
    environment:
      - API_URL=/api
    networks:
      - caldev-network
    profiles:
      - production

  # PHP Backend
  php-backend:
    image: 248189916187.dkr.ecr.us-west-2.amazonaws.com/caldev-backend:latest
    build:
      context: ../backend
      dockerfile: Dockerfile
    expose:
      - "80"
    environment:
      - PHP_ENV=development
      - SERVER_IP=${SERVER_IP:-localhost}
      - SERVER_DOMAIN=${SERVER_DOMAIN:-}
      - CALDAV_SERVER_URL=${CALDAV_SERVER_URL:-http://rc.mithi.com:8008}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_ENV=${APP_ENV:-production}
    networks:
      - caldev-network

networks:
  caldev-network:
    driver: bridge
