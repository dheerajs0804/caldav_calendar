<!-- Modal Overlay -->
<div *ngIf="isVisible" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" (click)="onCancel()">
  <!-- Modal Content -->
  <div class="bg-white rounded-lg shadow-xl max-w-md w-full mx-4" (click)="$event.stopPropagation()">
    <!-- Modal Header -->
    <div class="flex justify-between items-center p-6 border-b border-gray-200">
      <h3 class="text-lg font-semibold text-gray-900">Delete event</h3>
      <button 
        type="button" 
        class="text-gray-400 hover:text-gray-600 transition-colors"
        (click)="onCancel()"
        aria-label="Close modal"
      >
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <!-- Modal Body -->
    <div class="p-6">
      <!-- Event Info -->
      <div class="mb-4">
        <div class="text-sm text-gray-600 mb-2">
          <strong>{{ getEventTitle() }}</strong>
        </div>
        <div class="text-sm text-gray-500">
          {{ getEventTime() }}
        </div>
        <div *ngIf="getRecurrenceDescription()" class="text-sm text-gray-500 mt-1">
          {{ getRecurrenceDescription() }}
        </div>
      </div>

      <!-- Warning Message -->
      <div class="bg-yellow-50 border border-yellow-200 rounded-lg p-4 mb-6">
        <p class="text-sm text-yellow-800">
          This is a recurring event. Would you like to delete the current occurrence only or all occurrences of this event?
        </p>
      </div>

      <!-- Action Buttons -->
      <div class="flex space-x-3 mb-6">
        <button
          type="button"
          class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition-colors"
          (click)="onDelete('current')"
        >
          Current Occurrence
        </button>
        <button
          type="button"
          class="flex-1 bg-red-600 hover:bg-red-700 text-white font-medium py-2 px-4 rounded-lg transition-colors"
          (click)="onDelete('all')"
        >
          All Occurrences
        </button>
      </div>

      <!-- Cancel Button -->
      <div class="flex justify-end">
        <button
          type="button"
          class="bg-gray-500 hover:bg-gray-600 text-white font-medium py-2 px-4 rounded-lg transition-colors flex items-center"
          (click)="onCancel()"
        >
          <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
          Cancel
        </button>
      </div>
    </div>
  </div>
</div>
